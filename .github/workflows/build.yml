on: [push]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
      - name: Run PK3Make
        run: |
          pk3make
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weissblatt.pk3
          path: |
            bin/weissblatt.pk3
